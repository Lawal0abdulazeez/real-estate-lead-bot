services:
  db:
    image: mysql:8.4
    container_name: prh-leadbot-db
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: real_estate_leads
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p1234"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: prh-leadbot-api
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql+aiomysql://root:1234@db:3306/real_estate_leads
      DATABASE_URL_SYNC: mysql+pymysql://root:1234@db:3306/real_estate_leads
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  n8n:
    image: n8nio/n8n:latest
    container_name: prh-leadbot-n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Africa/Lagos
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/home/node/workflows
    depends_on:
      - db

  # Frontend can be run via npm locally during development.
  # Uncomment and configure when ready for containerized frontend.
  # frontend:
  #   build:
  #     context: ./frontend
  #   ports:
  #     - "3000:3000"
  #   volumes:
  #     - ./frontend:/app
  #     - /app/node_modules
  #   depends_on:
  #     - backend

volumes:
  mysql_data:
  n8n_data:
